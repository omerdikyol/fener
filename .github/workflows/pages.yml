# Publishes site/ to GitHub Pages when it changes on main, and once a day so the star count in
# the header stays current. The count is written into the page here, so visitors' browsers
# never ask GitHub for it.
name: website
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Star count
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          stars=$(gh api "repos/${{ github.repository }}" --jq .stargazers_count 2>/dev/null || echo 0)
          if [ "$stars" -ge 1000 ] 2>/dev/null; then label=$(awk "BEGIN { printf \"%.1fk\", $stars / 1000 }" | sed 's/\.0k/k/')
          elif [ "$stars" -ge 1 ] 2>/dev/null; then label=$stars
          else label=Star; fi
          sed -i "s|<b data-stars>[^<]*</b>|<b data-stars>$label</b>|" site/index.html
          echo "stars: $stars, shown as: $label"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
