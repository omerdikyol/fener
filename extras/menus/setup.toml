# Opens config files. `open -t` uses the default text editor; change it to your editor,
# e.g. open -a "Visual Studio Code".
width = 320

[[entry]]
name = "fener"
subtitle = "config.toml"
icon = "nf-md-tune"
command = "mkdir -p ~/.config/fener && touch ~/.config/fener/config.toml && open -t ~/.config/fener/config.toml"

[[entry]]
name = "fener Menus"
subtitle = "nf-fa-folder"
icon = "nf-fa-folder"
command = "open ~/.config/fener/menus"

[[entry]]
name = "Ghostty"
icon = "nf-md-ghost"
command = "open -t \"$HOME/Library/Application Support/com.mitchellh.ghostty/config\""

[[entry]]
name = "Karabiner"
icon = "nf-md-keyboard"
command = "open -a Karabiner-Elements"

[[entry]]
name = "SketchyBar"
icon = "nf-md-dock_top"
command = "open -t ~/.config/sketchybar/sketchybarrc"

[[entry]]
name = "Starship"
icon = "nf-md-star_shooting"
command = "open -t ~/.config/starship.toml"

[[entry]]
name = "OmniWM"
subtitle = "settings app (its file is strict)"
icon = "nf-md-view_quilt"
command = "open -a OmniWM"
