# Static menu: `fener show workspace`, or type ">workspace" in the launcher.
prompt = "Workspace…"
icon = "nf-md-view_grid"

[[entry]]
name = "Workspace 1"
icon = "nf-md-numeric_1_box"
command = "omniwmctl command switch-workspace 1"

[[entry]]
name = "Workspace 2"
icon = "nf-md-numeric_2_box"
command = "omniwmctl command switch-workspace 2"

[[entry]]
name = "Workspace 3"
icon = "nf-md-numeric_3_box"
command = "omniwmctl command switch-workspace 3"

[[entry]]
name = "Wallpaper"
subtitle = "pick a desktop picture"
icon = "nf-md-image"
menu = "wallpaper"
